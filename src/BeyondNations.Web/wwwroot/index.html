<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Beyond Nations</title>
  <meta name="description" content="Beyond Nations in your browser: a sandbox nation-simulation game. Gather wood and stone, found a nation and a settlement, and trade at its market.">
  <meta name="theme-color" content="#2b3a4f">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="Beyond Nations game view"></canvas>

  <section id="exited" class="panel" hidden>
    <h1>Beyond Nations</h1>
    <p>The game has exited.</p>
    <p class="buttons">
      <button id="play-again" type="button">Play again</button>
      <a class="button secondary" href="https://danielstephenson.dev/play">Back to the arcade</a>
    </p>
  </section>

  <section id="error" class="panel" hidden role="alert">
    <h1>Beyond Nations</h1>
    <p id="error-text">Something went wrong.</p>
    <p class="buttons">
      <button id="error-reload" type="button">Reload</button>
      <a class="button secondary" href="https://github.com/Preponderous-Software/beyond-nations/issues">Report it</a>
    </p>
  </section>

  <!-- On-screen controls, shown on touch screens while the world is up
       (main.js, webhost/touch.js; docs/WEB.md "Touch controls"). -->
  <div id="touch" aria-label="On-screen controls">
    <div class="stick" id="stick" role="application" aria-label="Walk and turn: drag the knob"><div class="knob"></div></div>
    <div class="tray" role="toolbar" aria-label="Panels">
      <button type="button" data-key="KeyI">Bag</button>
      <button type="button" data-key="KeyC">Craft</button>
      <button type="button" data-key="KeyO">Realm</button>
      <button type="button" data-key="KeyY">News</button>
      <button type="button" data-key="KeyV">View</button>
      <button type="button" data-key="Slash" aria-label="Controls">?</button>
      <button type="button" data-key="Escape">Menu</button>
    </div>
    <div class="actions" role="toolbar" aria-label="Actions">
      <button type="button" class="jump" data-key="Space">Jump</button>
      <button type="button" class="run" data-key="ShiftLeft" data-toggle>Run</button>
      <button type="button" class="use" data-key="KeyE">Use</button>
    </div>
  </div>

  <div id="rotate-hint" role="status" hidden>
    <span>Turn your phone sideways for a wider view.</span>
    <button type="button" id="rotate-dismiss">OK</button>
  </div>

  <div id="safe-area-probe" aria-hidden="true"></div>

  <noscript><p class="panel">Beyond Nations needs JavaScript and WebAssembly.</p></noscript>
  <!-- The Strata web kit's loading shell, vendored at the Strata commit in
       strata-kit/PIN (strata-kit/update.sh). main.js drives its bar from the
       .NET boot's progress (docs/WEB.md, "Loading screen"). -->
  <script src="strata-kit/strata-loader.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
