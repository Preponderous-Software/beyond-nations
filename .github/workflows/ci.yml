name: CI

on:
  pull_request:
    branches: ["main", "develop"]
  push:
    branches: ["main", "develop"]

# Stop previous runs for the same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Limit GITHUB_TOKEN permissions to only what is needed
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore BeyondNations.sln

      - name: Build
        run: dotnet build BeyondNations.sln --configuration Release --no-restore

      # A compiling project is not a passing one. Test failures fail this job,
      # which is what makes this a real merge gate -- the first the project has
      # had. See #215.
      - name: Test
        run: dotnet test BeyondNations.sln --configuration Release --no-build --verbosity normal

  core-is-engine-agnostic:
    name: Core is engine-agnostic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # BeyondNations.Core exists to be buildable and testable without a game
      # engine. That property is easy to lose by accident and cheap to check,
      # so it is checked rather than trusted.
      - name: Assert no engine reference in core
        run: |
          if grep -rn --include='*.cs' -E '^[[:space:]]*using[[:space:]]+UnityEngine' src/BeyondNations.Core; then
            echo "::error::BeyondNations.Core must not reference UnityEngine."
            exit 1
          fi
          echo "No UnityEngine reference in BeyondNations.Core."

      # The same goes for the native engine (#274): Core hands RenderItem to
      # whoever draws it, and must never reach for Strata or P/Invoke itself.
      - name: Assert no native engine reference in core
        run: |
          if grep -rn --include='*.cs' -E '\[(DllImport|LibraryImport)|NativeLibrary\.|StrataNative|using[[:space:]]+Strata' src/BeyondNations.Core; then
            echo "::error::BeyondNations.Core must not reference the Strata engine or P/Invoke."
            exit 1
          fi
          echo "No native engine reference in BeyondNations.Core."

  # Engine phase B1 (#275): the native renderer (Strata) must draw what the
  # Silk.NET renderer draws. One process renders the same snapshot with both,
  # for seeds 42, 7 (no pawns) and 1234 from three camera views, and fails if
  # the per-kind instance, drawn or culled counts differ, or if more than 1%
  # of pixels differ by over CIE76 Delta E 4 on llvmpipe. Then the real game
  # runs headlessly with --renderer native.
  renderer-parity:
    name: Renderer parity (Silk vs native, llvmpipe)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Mesa (llvmpipe) and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 libegl1

      - name: Build the parity tool and the game
        run: dotnet build tools/BeyondNations.RendererParity/BeyondNations.RendererParity.csproj --configuration Release

      - name: Parity and native smoke run
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          # xvfb-run waits until the X server is accepting connections; the
          # llvmpipe variables above reach Xvfb through its environment.
          mkdir -p parity-out
          xvfb-run -a -s "-screen 0 1280x800x24" \
            dotnet tools/BeyondNations.RendererParity/bin/Release/net8.0/BeyondNations.RendererParity.dll \
            --seeds 42,7,1234 --out parity-out
          xvfb-run -a -s "-screen 0 1280x800x24" \
            dotnet src/BeyondNations.Desktop/bin/Release/net8.0/BeyondNations.Desktop.dll \
            --renderer native --seed 42 --start-screen world --exit-after-frames 120 \
            --screenshot-after-frames 60 --render-stats --no-usage-reporting | tee parity-out/native-smoke.log
          grep -q "world renderer: native" parity-out/native-smoke.log
          cp ~/.local/share/BeyondNations/Screenshots/*.png parity-out/

      - name: Upload parity images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-parity
          path: parity-out/
          if-no-files-found: ignore
